name: Validate Muuvi

on:
  pull_request:
    branches:
      - feature/inicio-inteligente
  push:
    branches:
      - feature/moderacao-comunidade

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun run test

      # The repository-wide lint currently reports hundreds of pre-existing
      # formatting violations. Validate the moderation files independently.
      - name: Format and lint moderation files
        run: |
          bunx prettier --write src/lib/community-moderation-migration.test.ts src/lib/moderation-db.ts src/routes/_authenticated/comunidade.moderacao.tsx
          bunx eslint src/lib/community-moderation-migration.test.ts src/lib/moderation-db.ts src/routes/_authenticated/comunidade.moderacao.tsx

      - name: Build application
        run: bun run build
